# N'écouter que sur la carte du réseau nordal
interface=ens37
bind-interfaces
# DNS : l'intranet pointe vers srv-dns
domain=nordal.local
address=/intranet.nordal.local/192.168.50.10
# DHCP : plage d'adresses pour les clients
dhcp-range=192.168.50.100,192.168.50.150,12h
dhcp-option=option:dns-server,192.168.50.10
# Pas de passerelle annoncée : le poste garde sa sortie Internet par la carte NAT
dhcp-option=3
