# srv-dns : extrémité serveur du tunnel WireGuard
# Aucune clé privée dans ce fichier : elle est lue dans /etc/wireguard/private.key (droits 600)
[Interface]
Address = 10.99.0.1/24
ListenPort = 51820
PostUp = wg set %i private-key /etc/wireguard/private.key

[Peer]
# poste-lyon
PublicKey = <clé publique de poste-lyon>
AllowedIPs = 10.99.0.2/32
