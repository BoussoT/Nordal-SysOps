# poste-lyon : extrémité cliente du tunnel WireGuard
# Aucune clé privée dans ce fichier : elle est lue dans /etc/wireguard/private.key (droits 600)
[Interface]
Address = 10.99.0.2/24
PostUp = wg set %i private-key /etc/wireguard/private.key

[Peer]
# srv-dns
PublicKey = <clé publique de srv-dns>
Endpoint = 192.168.50.10:51820
AllowedIPs = 10.99.0.1/32
PersistentKeepalive = 25
